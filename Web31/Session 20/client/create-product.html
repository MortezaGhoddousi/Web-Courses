<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create Product</title>
        <link rel="stylesheet" href="./style.css" />

        <script src="./script.js"></script>
    </head>
    <body>
        <header>
            <h1>My Store</h1>

            <nav>
                <a href="./index.html" class="nav-link">Products</a>
                <a href="./create-product.html" class="add-product-btn">
                    + Add New Product
                </a>
            </nav>
        </header>

        <main class="form-main">
            <div class="form-container">
                <div class="form-header">
                    <h2>Create New Product</h2>
                    <p>Fill in the information below to add a new product.</p>
                </div>

                <form id="create-product-form">
                    <div class="form-group">
                        <label for="title">Product Name</label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Enter product name"
                        />
                    </div>

                    <div class="form-group">
                        <label for="price">Price ($)</label>
                        <input
                            type="number"
                            id="price"
                            name="price"
                            placeholder="Enter product price"
                            min="0"
                            step="0.01"
                        />
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category">
                            <option value="">Select a category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Fashion">Fashion</option>
                            <option value="Home">Home</option>
                            <option value="Sports">Sports</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="image">Image URL</label>
                        <input
                            type="url"
                            id="image"
                            name="image"
                            placeholder="https://example.com/image.jpg"
                        />
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            rows="5"
                            placeholder="Enter product description"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="stock">Stock Quantity</label>
                        <input
                            type="number"
                            id="stock"
                            name="stock"
                            placeholder="Enter stock quantity"
                            min="0"
                            step="1"
                        />
                    </div>

                    <div class="form-actions">
                        <a href="./index.html" class="cancel-btn"> Cancel </a>

                        <button type="submit" class="submit-btn">
                            Create Product
                        </button>
                    </div>
                </form>
            </div>
        </main>

        <footer>
            <p>© 2026 My Store. All rights reserved.</p>
        </footer>
    </body>
</html>
