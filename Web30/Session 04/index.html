<!DOCTYPE html>
<html>
    <head>
        <title>Web crash course</title>
    </head>
    <body>
        <h2>Sign-up form</h2>
        <form>
            <table>
                <tbody>
                    <tr>
                        <td>
                            <label for="username">Username</label>
                        </td>
                        <td>
                            <input
                                type="text"
                                name="username"
                                placeholder="John Smith"
                            />
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="password">Password</label>
                        </td>
                        <td>
                            <input type="password" name="password" />
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="email">Email</label>
                        </td>
                        <td>
                            <input type="email" name="email" />
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="firstname">Firstname</label>
                        </td>
                        <td>
                            <input type="text" name="firstname" />
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="lastname">Lastname</label>
                        </td>
                        <td>
                            <input type="text" name="lastname" />
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="phone">Phone number</label>
                        </td>
                        <td>
                            <input type="tel" name="phone" />
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="gender">Gender</label>
                        </td>
                        <td>
                            <input type="radio" name="gender" value="male" />
                            <span>Male</span>
                            <input type="radio" name="gender" value="female" />
                            <span>Female</span>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="skills">Skills</label>
                        </td>
                        <td>
                            <input type="checkbox" name="skills" value="html" />
                            <span>HTML</span>
                            <input type="checkbox" name="skills" value="css" />
                            <span>CSS</span>
                            <input type="checkbox" name="skills" value="js" />
                            <span>JS</span>
                            <input
                                type="checkbox"
                                name="skills"
                                value="react"
                            />
                            <span>REACT</span>
                            <input type="checkbox" name="skills" value="next" />
                            <span>NEXT</span>
                            <input type="checkbox" name="skills" value="node" />
                            <span>NODE</span>
                            <input
                                type="checkbox"
                                name="skills"
                                value="django"
                            />
                            <span>DJANGO</span>
                            <input
                                type="checkbox"
                                name="skills"
                                value="laravel"
                            />
                            <span>LARAVEL</span>
                            <input type="checkbox" name="skills" value="php" />
                            <span>PHP</span>
                            <input type="checkbox" name="skills" value="vue" />
                            <span>VUE</span>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="submit" value="Register" />
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>

        <audio
            src="./audio/StockTune-Reflective Office Afternoon_1721307614.mp3"
            controls
            loop
        ></audio>

        <video
            src="./video/coverr-premium-man-strumming-his-guitar-6025-1080p-w.mp4"
            controls
            loop
        ></video>
    </body>
</html>
